name: Update clients

# Pins the latest upstream spec tag, regenerates the clients and opens a PR with a suggested version bump.
# Merging that PR publishes all packages at the next shared version (see release.yml).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pin upstream specs
        id: specs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update-specs.ps1

      - name: Regenerate clients
        shell: pwsh
        run: ./scripts/generate-clients.ps1

      - name: Detect changed modules
        id: changes
        shell: pwsh
        run: ./scripts/changed-modules.ps1

      - name: Build and test
        if: steps.changes.outputs.changed != ''
        run: dotnet test --nologo

      - name: Classify changes
        id: classify
        if: steps.changes.outputs.changed != ''
        shell: pwsh
        run: ./scripts/classify-changes.ps1 -Modules '${{ steps.changes.outputs.changed }}'

      - name: Build PR body
        if: steps.changes.outputs.changed != ''
        shell: pwsh
        run: >
          ./scripts/build-pr-body.ps1
          -OldVersion '${{ steps.specs.outputs.old-version }}'
          -NewVersion '${{ steps.specs.outputs.new-version }}'
          -Changed '${{ steps.changes.outputs.changed }}'
          -New '${{ steps.changes.outputs.new }}'
          -Bump '${{ steps.classify.outputs.bump }}'
          -Breaking '${{ steps.classify.outputs.breaking }}'
          -OutPath "$env:RUNNER_TEMP/pr-body.md"

      # A GitHub App token makes the PR come from "<app>[bot]" and, unlike GITHUB_TOKEN, triggers CI on it.
      - name: Create app token
        id: app-token
        if: steps.changes.outputs.changed != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Get bot identity
        id: bot
        if: steps.changes.outputs.changed != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          branch: automation/update-clients
          commit-message: "Update generated clients to ChurchSuite API ${{ steps.specs.outputs.new-version }}"
          title: "Update generated ChurchSuite clients (API ${{ steps.specs.outputs.new-version }})"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: api-update
          delete-branch: true
